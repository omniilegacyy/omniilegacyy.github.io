<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Car Meet Reunion | Shaba's World</title><link rel="stylesheet" href="style.css?v=20260919-3">
<style>body{background:#080a0d;color:#f5f7fa;margin:0}.reunion-page{max-width:1500px;margin:auto;padding:120px 7vw 90px}.back{color:#ff7a00;text-decoration:none;font-weight:700}.title{font-family:Orbitron,sans-serif;font-size:clamp(2.8rem,7vw,6rem);margin:28px 0 12px}.title span{color:#ff7a00}.intro{color:#aab1bc;margin-bottom:38px}.reunion-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.reunion-gallery img{width:100%;height:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;border:1px solid rgba(255,122,0,.3);cursor:zoom-in}.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;padding:25px;z-index:9999}.lightbox.open{display:flex}.lightbox-photo-wrap{position:relative;display:inline-block;line-height:0}.lightbox img{max-width:94vw;max-height:90vh;object-fit:contain;display:block}.lightbox-year{position:absolute;top:16px;right:16px;z-index:2;padding:9px 14px;border-radius:9px;background:rgba(0,0,0,.58);border:1px solid rgba(255,255,255,.32);color:#fff;font:700 1rem Orbitron,sans-serif;letter-spacing:.08em;line-height:1;box-shadow:0 4px 18px rgba(0,0,0,.3)}.close{position:absolute;right:24px;top:20px;background:none;border:0;color:#fff;font-size:40px;cursor:pointer}@media(max-width:800px){.reunion-gallery{grid-template-columns:1fr}}</style></head>
<body><main class="reunion-page"><a class="back" href="car-meets-historical.html">← Historical Car Meets</a><h1 class="title">Car Meet <span>Reunion</span></h1><p class="intro">Friends, cars, memories — reunited.</p><div class="reunion-gallery">
<img src="images/civic-si/car-meets/reunion/reunion-01.jpg" alt="Car Meet Reunion photo 1">
<img src="images/civic-si/car-meets/reunion/reunion-02.jpg" alt="Car Meet Reunion photo 2">
<img src="images/civic-si/car-meets/reunion/reunion-03.jpg" alt="Car Meet Reunion photo 3">
</div></main><div class="lightbox" id="lightbox"><button class="close" aria-label="Close">×</button><div class="lightbox-photo-wrap"><img id="lightbox-img" alt=""><div class="lightbox-year">2017</div></div></div>
<script>(()=>{const imgs=[...document.querySelectorAll('.reunion-gallery img')],b=document.getElementById('lightbox'),bi=document.getElementById('lightbox-img');imgs.forEach(i=>i.onclick=()=>{bi.src=i.src;bi.alt=i.alt;b.classList.add('open')});b.querySelector('.close').onclick=()=>b.classList.remove('open');b.onclick=e=>{if(e.target===b)b.classList.remove('open')};document.onkeydown=e=>{if(e.key==='Escape')b.classList.remove('open')}})();</script></body></html>
